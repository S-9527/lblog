version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: lblog-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: iblog
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  lblog-server:
    build:
      context: ./lblog-server
      dockerfile: Dockerfile
    container_name: lblog-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LBLOG_UPLOAD_DIR: /app/uploads
      SPRING_PROFILE: ${SPRING_PROFILE:-default}
    ports:
      - "8099:8099"
    volumes:
      - lblog-uploads:/app/uploads
      - lblog-logs:/app/service-logs
    depends_on:
      mysql:
        condition: service_healthy

  lblog-web:
    build:
      context: ./lblog-web
      dockerfile: Dockerfile
    container_name: lblog-web
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - lblog-server

volumes:
  mysql-data:
  lblog-uploads:
  lblog-logs:
